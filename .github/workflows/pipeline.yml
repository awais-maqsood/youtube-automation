name: Auto Generate And Upload

on:
  schedule:
    # BlinkViral App TRUTH series: 2 Shorts/day (UTC).
    # ~12:05 UTC ≈ evening PKT/IST; ~22:05 UTC ≈ morning SA next day.
    - cron: "5 12 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Any slot — CHANNEL_NICHE=app_safety for all (App TRUTH series)"
        default: "morning"
      bypass_daily_cap:
        description: "Ignore DAILY_UPLOAD_CAP for this manual run (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore distribution state cache
        uses: actions/cache@v4
        with:
          path: |
            data/publish_catalog.json
            data/daily_upload_log.json
          key: distribution-state-${{ github.run_id }}
          restore-keys: |
            distribution-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          # click is required by spaCy's CLI (download); lexicon NER still works if model fails.
          pip install Pillow numpy "spacy>=3.7,<4" click --quiet
          python -m spacy download en_core_web_sm --quiet \
            || echo "::warning::spaCy model download failed; continuing with lexicon/pattern NER"

      - name: Detect slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "03" ]; then
              echo "slot=night" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "12" ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "17" ]; then
              echo "slot=afternoon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check daily upload cap
        id: cap
        env:
          DAILY_UPLOAD_CAP: ${{ vars.DAILY_UPLOAD_CAP }}
          BYPASS_DAILY_UPLOAD_CAP: ${{ github.event.inputs.bypass_daily_cap }}
        run: |
          python scripts/daily_cap.py --check --github-output

      - name: Generate video
        if: steps.cap.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TREND_GEO: ${{ vars.TREND_GEO }}
          NER_MIN_CONFIDENCE: ${{ vars.NER_MIN_CONFIDENCE }}
          DEMAND_MIN_SCORE: ${{ vars.DEMAND_MIN_SCORE }}
          SHORTS_DURATION_MIN: "15"
          SHORTS_DURATION_MAX: "20"
          SIMILARITY_TITLE_MAX: ${{ vars.SIMILARITY_TITLE_MAX }}
          SIMILARITY_OPENER_MAX: ${{ vars.SIMILARITY_OPENER_MAX }}
          SIMILARITY_CTA_MAX: ${{ vars.SIMILARITY_CTA_MAX }}
          SIMILARITY_CATALOG_MAX: ${{ vars.SIMILARITY_CATALOG_MAX }}
          TITLE_FAMILY_COOLDOWN: ${{ vars.TITLE_FAMILY_COOLDOWN }}
          CHANNEL_NICHE: app_safety
          DAILY_UPLOAD_CAP: ${{ vars.DAILY_UPLOAD_CAP }}
          BYPASS_DAILY_UPLOAD_CAP: ${{ github.event.inputs.bypass_daily_cap }}
          # Prefer free Pixabay/Pexels photos (Gemini/Freepik remain code fallbacks).
          STOCK_BACKGROUND_PROVIDER: pixabay
          PEXELS_IMAGE_COUNT: 8
          GEMINI_IMAGE_COUNT: 5
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image-preview
          GEMINI_IMAGE_SIZE: 1K
          GEMINI_IMAGE_ASPECT_RATIO: 9:16
          FREEPIK_IMAGE_COUNT: 12
          FREEPIK_CROSSFADE: 0.12
          STOCK_SCRIM: 0.25
          STOCK_MIN_LUMINANCE: 45
        run: |
          python scripts/run_pipeline.py --slot ${{ steps.slot.outputs.slot }}

      - name: Email review notice (before publish)
        if: steps.cap.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PRE_PUBLISH_WAIT_SECONDS: ${{ vars.PRE_PUBLISH_WAIT_SECONDS }}
        run: |
          python scripts/notify_before_publish.py --kit output/kit.json

      - name: Optional pre-publish review window
        if: steps.cap.outputs.should_run == 'true'
        env:
          PRE_PUBLISH_WAIT_SECONDS: ${{ vars.PRE_PUBLISH_WAIT_SECONDS }}
        run: |
          WAIT="${PRE_PUBLISH_WAIT_SECONDS:-300}"
          echo "Waiting ${WAIT}s before auto-publish..."
          sleep "$WAIT"

      - name: Upload to YouTube
        if: steps.cap.outputs.should_run == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NER_MIN_CONFIDENCE: ${{ vars.NER_MIN_CONFIDENCE }}
          SIMILARITY_TITLE_MAX: ${{ vars.SIMILARITY_TITLE_MAX }}
          SIMILARITY_OPENER_MAX: ${{ vars.SIMILARITY_OPENER_MAX }}
          SIMILARITY_CTA_MAX: ${{ vars.SIMILARITY_CTA_MAX }}
          SIMILARITY_CATALOG_MAX: ${{ vars.SIMILARITY_CATALOG_MAX }}
          TITLE_FAMILY_COOLDOWN: ${{ vars.TITLE_FAMILY_COOLDOWN }}
          CHANNEL_NICHE: app_safety
          DAILY_UPLOAD_CAP: ${{ vars.DAILY_UPLOAD_CAP }}
          BYPASS_DAILY_UPLOAD_CAP: ${{ github.event.inputs.bypass_daily_cap }}
        run: |
          python scripts/upload.py --kit output/kit.json --no-schedule

      - name: Skip notice (daily cap)
        if: steps.cap.outputs.should_run != 'true'
        run: |
          echo "Skipped — daily upload cap reached (${{ steps.cap.outputs.daily_count }}/${{ steps.cap.outputs.daily_cap }} UTC)."
          echo "Raise repo variable DAILY_UPLOAD_CAP or re-run with bypass_daily_cap=true."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-and-kit
          if-no-files-found: warn
          path: |
            output/video.mp4
            output/kit.json
            output/thumbnail.jpg
            data/daily_upload_log.json
            data/publish_catalog.json
