name: Tests

on:
  push:
    branches: [main]
    # The bot commits these after every upload; no code changes there.
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy --quiet

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
